  // girişim'i ölç: sağ kenar DECA'nın sağ kenarında, DECA'nın altında; tüm kilidi dikeyde ortala
  (function () {
    var b = g.getBBox();
    GX = TX + WORD_W - (b.x + b.width);
    GY = BASE_DECA + GAP_G - b.y;
    var top = -43.1 + BASE_DECA, bottom = GY + b.y + b.height;
    SHIFT = -(top + bottom) / 2;
    all.setAttribute('transform', 'translate(0 ' + SHIFT.toFixed(2) + ')');
    cgr.setAttribute('x', String(GX + b.x - 2));
  })();

  /* ---------- kare çizimi: t'nin saf fonksiyonu ---------- */
  function pts(t) {
    var u = seg(t, T_MORPH0, T_MORPH1), S = .58, out = [], head;
    // baş (köşe 7) önce yerine kayar; kuyruk (8–12) başın ARKASINDAN çıkıp D'yi tamamlar
    for (var k = 0; k < N; k++) {
      var s0 = k <= 7 ? (k / 7) * .3 : .34 + (k - 8) * .04;
      var p = eIO(cl((u - s0) / (1 - S)));
      var a = k <= 7 ? C[k] : head;
      if (k === 7) { head = [C[7][0] + (D[7][0] - C[7][0]) * p, C[7][1] + (D[7][1] - C[7][1]) * p]; out.push(head); continue; }
      out.push([a[0] + (D[k][0] - a[0]) * p, a[1] + (D[k][1] - a[1]) * p]);
    }
    return out;
  }
  function dStr(P, close) {
    var s = 'M' + P[0][0].toFixed(2) + ' ' + P[0][1].toFixed(2);
    for (var i = 1; i < P.length - (close ? 1 : 0); i++) s += 'L' + P[i][0].toFixed(2) + ' ' + P[i][1].toFixed(2);
    return s + (close ? 'Z' : '');
  }
  var unit = 1;                                      // 1 svg birimi kaç ekran pikseli
  function measure() { var r = svg.getBoundingClientRect(); unit = (r.width || 350) / 350; }

  function render(t) {
    var P = pts(t), done = t >= T_MORPH1;
    line.setAttribute('d', dStr(P, done));
    // çizim ilerlemesi (pathLength=1): 0 → 1
    var f = eIOs(seg(t, T_DRAW0, T_DRAW1));
    if (t < T_MORPH0) { line.style.strokeDasharray = '1 2'; line.style.strokeDashoffset = String(1 - f); }
    else { line.style.strokeDasharray = 'none'; line.style.strokeDashoffset = '0'; }
    // çizgi D'ye dönüşünce yazının gerçek D harfi belirir, çizgi söner (çapraz geçiş)
    var dIn = seg(t, T_MORPH1 - .25, T_MORPH1 - .05), lOut = seg(t, T_MORPH1 - .1, T_MORPH1 + .1);
    dg.setAttribute('opacity', dIn.toFixed(3));
    line.style.opacity = f > 0 ? String(1 - lOut) : '0';
    // kalınlık: ince çizgi (≥1.6 px) → yazının kalınlığına
    var wpx = Math.max(1.6, SW0 * unit), sw0 = wpx / unit;
    var sw = sw0 + (SW1 - sw0) * eIO(seg(t, T_MORPH0 + .1, T_MORPH1));
    line.setAttribute('stroke-width', sw.toFixed(2));
    // E-C-A soldan açılır, girişim sağ-alttan belirir
    var a = eO(seg(t, T_WORD0, T_WORD1));
    cwr.setAttribute('width', (a * (WORD_W - 50)).toFixed(2));
    w.style.opacity = String(cl(a * 2)); w.setAttribute('transform', 'translate(' + (TX + (1 - a) * -8).toFixed(2) + ' ' + BASE_DECA + ')');
    var b = eO(seg(t, T_SUB0, T_SUB1));
    cgr.setAttribute('width', (b * (WORD_W + 8)).toFixed(2));
    g.style.opacity = String(cl(b * 2)); g.setAttribute('transform', 'translate(' + (GX + (1 - b) * -8).toFixed(2) + ' ' + GY.toFixed(2) + ')');
    // kapanış: logo çok hafif yükselip söner, perde yukarı açılır → hero
    var o = seg(t, T_OUT0, T_OUT1), oe = eIO(o);
    svg.style.opacity = String(1 - cl(o * 2.2));
    svg.style.transform = 'translateY(' + (-14 * oe).toFixed(2) + 'px)';
    ov.style.clipPath = 'inset(0 0 ' + (oe * 100).toFixed(2) + '% 0)';
    ov.style.visibility = t >= T_END ? 'hidden' : 'visible';
  }

  /* ---------- oynatıcı ---------- */
  var raf = 0, t0 = 0, finished = false, fb = 0;
  function finish() {
    if (finished) return; finished = true;
    cancelAnimationFrame(raf); clearTimeout(fb);
    try { sessionStorage.setItem('deca_intro_v1', '1'); } catch (e) {}
    root.classList.remove('deca-intro-on');
    if (ov.parentNode) ov.parentNode.removeChild(ov);
    if (st.parentNode) st.parentNode.removeChild(st);
    d.removeEventListener('keydown', onKey);
    try { window.dispatchEvent(new Event('deca:intro-end')); } catch (e) {}
  }
  function skip() { // atla: perdeyi hızla aç
    if (finished) return;
    var from = (performance.now() - t0) / 1000;
    if (from >= T_OUT0) return;
    t0 = performance.now() - (T_OUT0 + .05) * 1000;
  }
  function onKey(e) { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); skip(); } }
  function tick(now) {
    var t = (now - t0) / 1000;
    render(t);
    if (t >= T_END) finish(); else raf = requestAnimationFrame(tick);
  }
  function play() {
    measure(); render(0); ov.classList.add('di-live');
    raf = requestAnimationFrame(function (n) { t0 = n; tick(n); });
    fb = setTimeout(finish, 6000);
  }
  ov.addEventListener('click', skip); d.addEventListener('keydown', onKey);
  window.addEventListener('resize', measure);
  if (/[?&]intro=debug\b/.test(q)) {                    // kare kare test için
    window.__decaIntro = { seek: function (t) { measure(); render(t); }, end: T_END };
    measure(); render(0); ov.classList.add('di-live');
  } else play();
})();
</script></head><body><button id="again" onclick="location.reload()">Tekrar oynat</button></body></html>
