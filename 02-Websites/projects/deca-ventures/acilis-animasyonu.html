<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deca Girişim — açılış animasyonu (önizleme)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<!--
  Deca Girişim — gravür açılış animasyonu + logonun menüye geçişi
  Onaylanan tasarım: 26 Ekim 2026 (Claude Design kanvası "Deca Girişim Logo", artboard "Gravür → sitedeki logo")
  Davranış:
    - Sadece oturumdaki ilk ziyarette oynar (sessionStorage: decaIntroSeen)
    - Tıklama, tuş, kaydırma ya da dokunma ile atlanır
    - "Hareketi azalt" açık kullanıcılarda hiç oynamaz
  Siteye taşırken: <style> bloğu, #deca-intro katmanı ve en alttaki <script> yeterli.
  Menüdeki logo .site-logo sınıfını taşımalı; animasyon logoyu oraya uçurur.
-->
<style>
  :root{
    --navy:#0D1321; --ivory:#ECE6DA; --spark:#FFFAEE; --sub:#C9C3B8;
    --hairline:#3A4256; --muted:#8E96A8; --body:#B9C0CF;
    --wm-h:clamp(56px, 8.4vw, 120px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--navy);color:var(--ivory);font-family:'Jost',system-ui,sans-serif}

  /* ---------- örnek site (yer tutucu) ---------- */
  .site-header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:40px clamp(16px,5vw,72px) 0}
  .site-brand{display:flex;align-items:center;gap:14px;text-decoration:none}
  .site-logo{display:flex;align-items:flex-end;gap:6.6px;height:20px}
  .site-logo svg{height:100%;width:auto;fill:var(--ivory)}
  .site-brand .rule{width:1px;height:20px;background:var(--hairline)}
  .site-brand .sub{font-weight:300;font-size:11px;letter-spacing:.5em;color:var(--sub)}
  .site-nav{display:flex;flex-wrap:wrap;gap:16px 40px;font-size:13px;letter-spacing:.18em}
  .site-nav a{color:var(--sub);text-decoration:none}
  .site-nav a:hover{color:#fff}
  .hero{min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;gap:28px;padding:0 clamp(16px,5vw,72px)}
  .hero .eyebrow{font-size:12px;letter-spacing:.4em;color:var(--muted)}
  .hero h1{margin:0;max-width:820px;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(44px,6vw,84px);line-height:1.02}
  .hero p{margin:0;max-width:520px;font-size:18px;line-height:1.7;color:var(--body)}
  .hero .btn{align-self:flex-start;margin-top:12px;min-height:48px;display:flex;align-items:center;padding:0 30px;border:1px solid var(--ivory);color:var(--ivory);font-size:13px;letter-spacing:.24em;text-decoration:none}

  /* intro sürerken site içeriği gizli, bitince belirir */
  body.intro-running .site-brand, body.intro-running .site-nav, body.intro-running .hero{opacity:0}
  body.intro-done .site-brand .rule, body.intro-done .site-brand .sub, body.intro-done .site-nav{animation:dFade .6s ease both}
  body.intro-done .hero{animation:dFadeUp .9s cubic-bezier(.2,.7,.1,1) .05s both}
  body.intro-running .site-logo{visibility:hidden}

  /* ---------- açılış katmanı ---------- */
  #deca-intro{position:fixed;inset:0;z-index:9999;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  #deca-intro.is-leaving{background:transparent;transition:background .4s ease}
  .di-logo{position:relative;display:flex;align-items:flex-end;gap:calc(var(--wm-h) / 3);height:var(--wm-h);transform-origin:0 0}
  .di-l{position:relative;height:100%}
  .di-l svg{display:block;height:100%;width:auto;overflow:visible}
  .di-l .fill{position:absolute;inset:0;clip-path:inset(100% 0 0 0);animation:dFill .95s cubic-bezier(.6,0,.25,1) forwards}
  .di-l .fill svg{fill:var(--ivory)}
  .di-l .line path,.di-l .line polygon{fill:none;stroke:var(--ivory);stroke-width:.7;animation:dDraw 1.35s cubic-bezier(.55,0,.3,1) forwards}
  .di-l .line{animation:dHide .6s ease 2.85s forwards}
  .di-dia{fill:var(--spark);opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:dDia .6s cubic-bezier(.3,1,.5,1) 2.75s forwards}
  .di-sub{margin-top:calc(var(--wm-h) / 3);font-weight:300;font-size:calc(var(--wm-h) * .175);letter-spacing:.58em;text-indent:.58em;color:var(--sub);opacity:0;animation:dFade .6s ease 2.8s forwards}
  #deca-intro.is-leaving .di-sub{opacity:0;transition:opacity .35s ease}

  @keyframes dDraw{to{stroke-dashoffset:0}}
  @keyframes dFill{to{clip-path:inset(0 0 0 0)}}
  @keyframes dHide{to{opacity:0}}
  @keyframes dDia{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
  @keyframes dFade{from{opacity:0}to{opacity:1}}
  @keyframes dFadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="intro-running">

<!-- ===== Örnek site başlığı ve hero (yer tutucu metinler) ===== -->
<header class="site-header">
  <a class="site-brand" href="#" aria-label="Deca Girişim ana sayfa">
    <span class="site-logo" aria-hidden="true">
      <svg viewBox="0 0 90 100"><path fill-rule="evenodd" d="M0 0 H40 A50 50 0 0 1 40 100 H0 Z M14 3 H40 A38 47 0 0 1 40 97 H14 Z"/></svg>
      <svg viewBox="0 0 58 100"><path d="M0 0 H56 V3 H14 V48.5 H48 V51.5 H14 V97 H58 V100 H0 Z"/></svg>
      <svg viewBox="0 0 86 100"><path d="M83.9 14.6 A48 50 0 1 0 83.9 85.4 L77.7 85.4 A36 47 0 1 1 77.7 14.6 Z"/></svg>
      <svg viewBox="0 0 84 100"><polygon points="36,0 40,0 3.5,100 0,100"/><polygon points="36,0 46,0 84,100 70,100"/><polygon points="37,63 41.5,70 37,77 32.5,70" style="fill:var(--spark)"/></svg>
    </span>
    <span class="rule"></span>
    <span class="sub">GİRİŞİM</span>
  </a>
  <nav class="site-nav" aria-label="Ana menü">
    <a href="#">[MENÜ 1]</a><a href="#">[MENÜ 2]</a><a href="#">[MENÜ 3]</a><a href="#">[İLETİŞİM]</a>
  </nav>
</header>
<main class="hero">
  <span class="eyebrow">[ÜST BAŞLIK]</span>
  <h1>[Hero başlığı buraya gelecek]</h1>
  <p>[Deca Girişim'i anlatan kısa açıklama metni]</p>
  <a class="btn" href="#">[BUTON]</a>
</main>

<!-- ===== Açılış katmanı ===== -->
<div id="deca-intro" aria-hidden="true">
  <div class="di-logo">
    <span class="di-l">
      <span class="line"><svg viewBox="0 0 90 100"><path style="stroke-dasharray:700;stroke-dashoffset:700;animation-delay:.05s" d="M0 0 H40 A50 50 0 0 1 40 100 H0 Z M14 3 H40 A38 47 0 0 1 40 97 H14 Z"/></svg></span>
      <span class="fill" style="animation-delay:1.4s"><svg viewBox="0 0 90 100"><path fill-rule="evenodd" d="M0 0 H40 A50 50 0 0 1 40 100 H0 Z M14 3 H40 A38 47 0 0 1 40 97 H14 Z"/></svg></span>
    </span>
    <span class="di-l">
      <span class="line"><svg viewBox="0 0 58 100"><path style="stroke-dasharray:480;stroke-dashoffset:480;animation-delay:.22s" d="M0 0 H56 V3 H14 V48.5 H48 V51.5 H14 V97 H58 V100 H0 Z"/></svg></span>
      <span class="fill" style="animation-delay:1.57s"><svg viewBox="0 0 58 100"><path d="M0 0 H56 V3 H14 V48.5 H48 V51.5 H14 V97 H58 V100 H0 Z"/></svg></span>
    </span>
    <span class="di-l">
      <span class="line"><svg viewBox="0 0 86 100"><path style="stroke-dasharray:560;stroke-dashoffset:560;animation-delay:.39s" d="M83.9 14.6 A48 50 0 1 0 83.9 85.4 L77.7 85.4 A36 47 0 1 1 77.7 14.6 Z"/></svg></span>
      <span class="fill" style="animation-delay:1.74s"><svg viewBox="0 0 86 100"><path d="M83.9 14.6 A48 50 0 1 0 83.9 85.4 L77.7 85.4 A36 47 0 1 1 77.7 14.6 Z"/></svg></span>
    </span>
    <span class="di-l">
      <span class="line"><svg viewBox="0 0 84 100"><polygon style="stroke-dasharray:220;stroke-dashoffset:220;animation-delay:.56s" points="36,0 40,0 3.5,100 0,100"/><polygon style="stroke-dasharray:240;stroke-dashoffset:240;animation-delay:.56s" points="36,0 46,0 84,100 70,100"/></svg></span>
      <span class="fill" style="animation-delay:1.91s"><svg viewBox="0 0 84 100"><polygon points="36,0 40,0 3.5,100 0,100"/><polygon points="36,0 46,0 84,100 70,100"/></svg></span>
      <svg viewBox="0 0 84 100" style="position:absolute;inset:0;height:100%"><polygon class="di-dia" points="37,63 41.5,70 37,77 32.5,70"/></svg>
    </span>
  </div>
  <div class="di-sub">GİRİŞİM</div>
</div>

<script>
(function () {
  var intro = document.getElementById('deca-intro');
  var body = document.body;
  var finished = false, timers = [];

  function finish() {
    if (finished) return;
    finished = true;
    timers.forEach(clearTimeout);
    if (intro && intro.parentNode) intro.parentNode.removeChild(intro);
    body.classList.remove('intro-running');
    body.classList.add('intro-done');
    try { sessionStorage.setItem('decaIntroSeen', '1'); } catch (e) {}
    ['click', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) { window.removeEventListener(ev, finish); });
  }

  var seen = false;
  try { seen = sessionStorage.getItem('decaIntroSeen') === '1'; } catch (e) {}
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (seen || reduce || !intro) { finish(); return; }

  ['click', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, finish, { passive: true }); });

  // 3,45 sn: logo menüdeki yerine uçar
  timers.push(setTimeout(function () {
    var from = intro.querySelector('.di-logo').getBoundingClientRect();
    var to = document.querySelector('.site-logo').getBoundingClientRect();
    var logo = intro.querySelector('.di-logo');
    var s = to.height / from.height;
    intro.classList.add('is-leaving');
    logo.style.transition = 'transform 1s cubic-bezier(.75,0,.2,1)';
    logo.style.transform = 'translate(' + (to.left - from.left) + 'px,' + (to.top - from.top) + 'px) scale(' + s + ')';
  }, 3450));

  // 4,45 sn: katman kalkar, site belirir
  timers.push(setTimeout(finish, 4450));
})();
</script>
</body>
</html>
