<!doctype html>
<html lang="tr">
<head>
<base href="../../../">
<meta charset="utf-8">
<title>Humentis — uzman reels kapağı (şablon)</title>
<!--
  ŞABLON: Humentis uzman anlatımı reels kapağı, 1080×1920. 31 Eki 2026.
  Kaynak tasarım: duygu-korlugu-kapak-uzman.html (Irmak Tara Sığırcı, 30 Eki; Vivamor iskeleti + Humentis siluet sembolü,
  kullanıcının son onayladığı hâl "H3 · siluet"). Bu dosya aynı kartı veriyle basar; tasarım değişirse burada değişir.
  İstek (31 Eki): "hatice kıykım hoca içinde aynı karttan hazırla".
  Kullanım: ?k=<anahtar> (aşağıdaki JSON). Her kayıt:
    on / soy      ad (kalın) ve SOYAD (ince, büyük harf; İ elle yazılır)
    unvan         sitedeki unvan (<br> serbest) — kasada ❓ ise sitedekini kullan, yükseltme
    etiket        konu üst satırı (BÜYÜK HARF), baslik: [düz satır, italik altın satır]
    foto          dekupe şeffaf PNG (scripts/dekupe.swift)
    kutu          [left, top, genişlik, yükseklik] px. Ölçü: yüz yüksekliği ~460 px, yüz merkezi x ~700, yüz üstü y ~870;
                  fotoğrafın altı ≥ 1820 (perde orada tam kapanır). Yüz kutusu Apple Vision ile ölçülür.
  Güvenli alan: profil ızgarası 3:4 (y 240–1680); alt satır (logo + site) yalnız tam 9:16'da.
  PNG için:
    perl -e 'alarm 60; exec @ARGV' "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
      --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=1 --window-size=1080,1920 \
      --virtual-time-budget=8000 --screenshot=<cikti>.png "file://<bu-dosya>?k=<anahtar>"
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,600&display=block" rel="stylesheet">
<style>
  :root{ --petrol:#073F41; --gold:#CEAB69; --gold-acik:#E3C48A; --cream:#F6EFDD; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#062A2B}
  body{-webkit-font-smoothing:antialiased}
  .slide{width:1080px;height:1920px;position:relative;overflow:hidden;
    background:radial-gradient(120% 75% at 68% 38%, #12514F 0%, #0A3B3C 46%, #062A2B 100%)}
  .slide > *{position:absolute}
  .gren{inset:0;z-index:50;pointer-events:none;opacity:.55;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .44  0 0 0 .12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

  /* soluk ışıklar (şeftali · açık altın · adaçayı) */
  .isik{width:600px;height:600px;border-radius:50%;filter:blur(70px);mix-blend-mode:screen;opacity:.42}
  .i1{left:130px;top:540px;opacity:.5;background:radial-gradient(circle, #E3A385 0%, rgba(227,163,133,.6) 40%, rgba(227,163,133,0) 70%)}
  .i2{left:400px;top:310px;background:radial-gradient(circle, #E6CB96 0%, rgba(230,203,150,.6) 40%, rgba(230,203,150,0) 70%)}
  .i3{left:680px;top:580px;background:radial-gradient(circle, #8FC2B4 0%, rgba(143,194,180,.6) 40%, rgba(143,194,180,0) 70%)}
  /* Humentis sembolü, siluet (maske; kum → adaçayı, %17) */
  .sembol{left:132px;top:352px;width:930px;height:1088px;z-index:2;opacity:.17;
    background:linear-gradient(180deg,#E6D3C2 0%,#C9D6C8 55%,#AFC5B2 100%);
    -webkit-mask:url("03-Assets/logos/humentis/humentis-mark-mono.svg") center/100% 100% no-repeat}
  .uzman{z-index:3;max-width:none;filter:drop-shadow(0 30px 50px rgba(0,0,0,.35))}
  .alt-perde{left:0;right:0;top:1200px;height:720px;z-index:4;
    background:radial-gradient(70% 55% at 18% 52%, rgba(6,42,43,.72) 0%, rgba(6,42,43,0) 100%),
               linear-gradient(180deg, rgba(6,42,43,0) 0%, rgba(6,42,43,0) 52%, rgba(6,42,43,.8) 72%, #062A2B 86%)}

  .ad{left:84px;top:262px;z-index:6;color:var(--cream)}
  .ad .on{font:800 96px/1 'Manrope';letter-spacing:-1.5px}
  .ad .soy{margin-top:8px;font:300 58px/1 'Manrope';letter-spacing:.07em}
  .ad i{display:block;margin-top:24px;width:76px;height:3px;background:var(--gold)}
  .ad .unvan{margin-top:20px;font:500 25px/1.35 'Manrope';color:rgba(246,239,221,.82)}
  .etiket{right:84px;top:286px;z-index:6;font:700 18px/1 'Manrope';letter-spacing:.3em;margin-right:-.3em;color:var(--gold)}

  .konu{left:84px;top:1352px;z-index:6;padding-left:30px;border-left:3px solid var(--gold)}
  .konu small{display:block;font:700 21px/1 'Manrope';letter-spacing:.32em;color:var(--gold);margin-bottom:18px}
  .konu h1{font:600 118px/1 'Source Serif 4';letter-spacing:-2px;color:var(--cream);white-space:nowrap}
  .konu h1 em{display:block;font-style:italic;color:var(--gold-acik)}

  .logo{left:84px;top:1736px;height:62px;z-index:6;filter:brightness(0) invert(94%) sepia(12%) saturate(320%) hue-rotate(345deg)}
  .site{right:84px;top:1740px;z-index:6;display:flex;align-items:center;gap:12px;padding:14px 26px;border-radius:999px;
        border:1.5px solid rgba(206,171,105,.7);font:600 23px/1 'Manrope';color:var(--cream)}
  .site b{display:block;width:9px;height:9px;border-radius:50%;background:var(--gold)}
</style>
</head>
<body>
<script id="veri" type="application/json">
{
  "irmak-duygu-korlugu": {
    "_not": "30 Eki; duygu-korlugu-kapak-uzman.html ile aynı (sitedeki fotoğrafın dekupesi, 1,05 ölçek)",
    "on": "Irmak", "soy": "TARA SIĞIRCI", "unvan": "Uzman Psikolog<br>& Aile Danışmanı",
    "etiket": "ALEKSİTİMİ", "baslik": ["Duygu", "körlüğü"],
    "foto": "03-Assets/images/humentis/uzmanlar/irmak-tara-sigirci-dekupe.png", "kutu": [114, 477, 1202, 1443]
  },
  "hatice-zihindeki-senaryolar": {
    "_not": "31 Eki; IMG_1198.mov 39,40 sn karesi (4K), x 440–2700 kesit, dekupe renk ayıklamasız; yüz x .345 üst .229 y .353 → 0,62 ölçek. Unvan sitedeki 'Psikolog' (videoda 'Uzman Psikolog'; kasada ❓)",
    "on": "Hatice", "soy": "KIYKIM", "unvan": "Psikolog",
    "etiket": "AŞIRI DÜŞÜNME", "baslik": ["Zihindeki", "senaryolar"],
    "foto": "03-Assets/images/humentis/uzmanlar/hatice-kiykim-dekupe-video.png", "kutu": [-20, 570, 1401, 1339]
  },
  "hatice-zihindeki-senaryolar-site": {
    "_not": "31 Eki; kullanıcı: 'sitedeki fotoğrafı kullanarak hazırla'. uzmanlar/hatice-kiykim.jpg (900×1121) Lanczos ×2 + CISharpenLuminance .35 → dekupe (duvar 232 243 245). Yüz x .293 üst .416 y .128 (2× görüntüde 287 px) → 1,045 ölçek, yüz ~300 px (orijinale göre ~2,1× büyütme). Koltuk kolçakları dekupede kaldı.",
    "on": "Hatice", "soy": "KIYKIM", "unvan": "Psikolog",
    "etiket": "AŞIRI DÜŞÜNME", "baslik": ["Zihindeki", "senaryolar"],
    "foto": "03-Assets/images/humentis/uzmanlar/hatice-kiykim-dekupe-site-2x.png", "kutu": [0, -115, 1881, 2343]
  },
  "hatice-zihindeki-senaryolar-site-kucuk": {
    "_not": "31 Eki; 'görüntü çok kalitesiz': aynı site dekupesi 0,85 ölçekte (orijinale göre ~1,7× büyütme, yüz ~245 px), daha net",
    "on": "Hatice", "soy": "KIYKIM", "unvan": "Psikolog",
    "etiket": "AŞIRI DÜŞÜNME", "baslik": ["Zihindeki", "senaryolar"],
    "foto": "03-Assets/images/humentis/uzmanlar/hatice-kiykim-dekupe-site-2x.png", "kutu": [130, 87, 1530, 1906]
  },
  "muge-anne-sikildim": {
    "_not": "3 Kas; kullanıcı: 'kart fotoğrafını siteden çek'. uzmanlar/muge-ertugrul.jpg (768×1024, sitedekiyle bayt bayt aynı). Zincir: buyut ×2 keskinliksiz → dekupe -1 -1 -1 0.4 0.6 --asin=2 --yumusat=2.5 (arka plan tablolu, düz değil) → birlestir (iç bölge foto-iyilestir ×2 sürümünden, r 5). Yüz x .303 üst .271 y .203 (2× görüntüde 416 px) → 0,817 ölçek, yüz ~340 px (orijinale göre ~1,6×). Unvan sitedeki 'Çocuk Gelişimi Uzmanı' (videonun alt bandında 'Uzman Psikolog'; ❓)",
    "on": "Müge", "soy": "ERTUĞRUL", "unvan": "Çocuk Gelişimi Uzmanı",
    "etiket": "ÇOCUK VE EKRAN", "baslik": ["Anne,", "sıkıldım!"],
    "foto": "03-Assets/images/humentis/uzmanlar/muge-ertugrul-dekupe-site-2x.png", "kutu": [150, 417, 1255, 1674]
  }
}
</script>
<div class="slide" id="slide">
  <div class="isik i1"></div><div class="isik i2"></div><div class="isik i3"></div>
  <div class="sembol"></div>
  <img class="uzman" id="foto" alt="">
  <div class="alt-perde"></div>
  <div class="ad">
    <div class="on" id="on"></div>
    <div class="soy" id="soy"></div>
    <i></i>
    <div class="unvan" id="unvan"></div>
  </div>
  <div class="etiket">UZMAN ANLATIYOR</div>
  <div class="konu"><small id="etiket"></small><h1 id="baslik"></h1></div>
  <img class="logo" src="03-Assets/logos/humentis/humentis-lockup-horizontal-mono.svg" alt="Humentis">
  <div class="site"><b></b>humentis.com.tr</div>
  <div class="gren"></div>
</div>
<script>
  const V = JSON.parse(document.getElementById('veri').textContent);
  const k = new URLSearchParams(location.search).get('k') || Object.keys(V).pop();
  const d = V[k];
  const yaz = (id, t) => { document.getElementById(id).textContent = t; };
  yaz('on', d.on); yaz('soy', d.soy); yaz('etiket', d.etiket);
  document.getElementById('unvan').innerHTML = d.unvan.split('<br>').map(s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')).join('<br>');
  const h = document.getElementById('baslik');
  h.textContent = d.baslik[0];
  const em = document.createElement('em'); em.textContent = d.baslik[1]; h.appendChild(em);
  const f = document.getElementById('foto');
  f.src = d.foto;
  Object.assign(f.style, { left: d.kutu[0] + 'px', top: d.kutu[1] + 'px', width: d.kutu[2] + 'px', height: d.kutu[3] + 'px' });
  document.title = 'Humentis — ' + d.on + ' ' + d.soy + ' reels kapağı';
</script>
</body>
</html>
